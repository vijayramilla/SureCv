<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark purple background -->
  <rect width="1200" height="630" fill="#1a1d3a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2554;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Gradient background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="150" fill="#a855f7" opacity="0.1"/>
  <circle cx="100" cy="550" r="180" fill="#7c3aed" opacity="0.1"/>
  
  <!-- Main text: SureCv -->
  <text x="600" y="280" font-size="120" font-weight="800" text-anchor="middle" fill="url(#textGradient)" font-family="Plus Jakarta Sans, Arial, sans-serif">
    SureCv
  </text>
  
  <!-- Tagline -->
  <text x="600" y="370" font-size="48" font-weight="600" text-anchor="middle" fill="#e2e8f0" font-family="Plus Jakarta Sans, Arial, sans-serif">
    AI Resume Builder
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="420" font-size="32" text-anchor="middle" fill="#94a3b8" font-family="Plus Jakarta Sans, Arial, sans-serif">
    Get Your Resume Hired
  </text>
</svg>